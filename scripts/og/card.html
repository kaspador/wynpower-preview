<!DOCTYPE html>
<!-- Share image template (1200x630). Rendered by scripts/make-og.py. -->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 680px 520px;
    background: #f8f6f2;
    color: #1f2429;
    font-family: "Source Sans 3", Arial, sans-serif;
  }
  .text {
    display: flex;
    flex-direction: column;
    padding: 56px 56px 0 64px;
    border-bottom: 14px solid #a8431f;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand-name { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 34px; line-height: 1; }
  .brand-sub { font-size: 18px; color: #5b6168; margin-top: 6px; letter-spacing: .02em; }
  .kicker {
    margin-top: 58px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #a8431f;
  }
  h1 {
    margin-top: 14px;
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 58px;
    line-height: 1.08;
    letter-spacing: -.01em;
  }
  .sub { margin-top: 18px; font-size: 26px; line-height: 1.3; color: #3d434a; }
  .foot {
    margin-top: auto;
    padding-bottom: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .call {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #a8431f;
    color: #fff;
    font-weight: 700;
    font-size: 26px;
    padding: 14px 24px;
    border-radius: 6px;
  }
  .domain { font-size: 21px; color: #5b6168; font-weight: 600; }
  .photo { background-size: cover; background-position: center; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <img src="../../assets/img/logo-mark-192.png" alt="">
      <div>
        <div class="brand-name">WynnsLegal</div>
        <div class="brand-sub">Wills &middot; Estates &middot; Estate Planning</div>
      </div>
    </div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="foot">
      <span class="call">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        (03) 9742 3192
      </span>
      <span class="domain">wynnslegal.com.au</span>
    </div>
  </div>
  <div class="photo" id="photo"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("kicker").textContent = q.get("kicker") || "City of Wyndham · Since 2008";
  document.getElementById("title").textContent = q.get("title") || "";
  document.getElementById("sub").textContent = q.get("sub") || "";
  const photo = document.getElementById("photo");
  photo.style.backgroundImage = `url("../../assets/img/photos/${q.get("photo")}")`;
  photo.style.backgroundPosition = q.get("pos") || "center";
</script>
</body>
</html>
